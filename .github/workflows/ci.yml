name: "CI"
# Los tests originales de Juice Shop verifican que las vulnerabilidades sean explotables,
# por lo que fallarían al corregirlas. Solo se conserva el lint.
on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
  # Sin filtro de rutas: lint es un check obligatorio y debe correr en todos los PRs
  pull_request:
env:
  NODE_DEFAULT_VERSION: 24
  NODE_OPTIONS: "--max_old_space_size=4096"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}
      - name: "Install application minimalistically"
        run: |
          npm install --ignore-scripts
          cd frontend
          npm install --ignore-scripts
      - name: "Lint source code"
        run: npm run lint
